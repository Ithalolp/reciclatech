<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel administrativo — ReciclaTech</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="admin-body">
    <!-- TELA DE LOGIN -->
    <section class="login-tela" id="tela-login">
      <form class="login-card" id="form-login" autocomplete="off">
        <h1>
          <span class="logo__icon">♻️</span>
          <span data-nome-plataforma>ReciclaTech</span>
        </h1>
        <p class="login-card__sub">Área restrita ao administrador</p>

        <label for="usuario">Usuário</label>
        <input
          type="text"
          id="usuario"
          name="usuario"
          required
          autocomplete="username"
        />

        <label for="senha">Senha</label>
        <input
          type="password"
          id="senha"
          name="senha"
          required
          autocomplete="current-password"
        />

        <button class="btn btn--primary btn--block" type="submit">
          Entrar
        </button>
        <p class="login-card__erro" id="login-erro" role="alert" hidden>
          Usuário ou senha inválidos.
        </p>

        <p class="login-card__dica">
          Credenciais padrão: <strong>admin</strong> / <strong>recicla</strong
          ><br />
          <small>(altere em <code>js/config.js</code>)</small>
        </p>
        <a class="login-card__voltar" href="index.html">← Voltar ao site</a>
      </form>
    </section>

    <!-- PAINEL -->
    <section class="painel" id="tela-painel" hidden>
      <header class="painel-header">
        <div class="container painel-header__inner">
          <div class="logo">
            <span class="logo__icon">♻️</span>
            <span class="logo__text" data-nome-plataforma>ReciclaTech</span>
            <span class="painel-badge">Admin</span>
          </div>
          <div class="painel-header__acoes">
            <a
              class="btn btn--ghost btn--sm"
              href="index.html"
              target="_blank"
              rel="noopener"
              >Ver site</a
            >
            <button class="btn btn--danger btn--sm" id="btn-sair">Sair</button>
          </div>
        </div>
      </header>

      <div class="container painel-conteudo">
        <nav class="tabs" role="tablist">
          <button class="tab ativo" data-tab="pontos" role="tab">
            Pontos de coleta
          </button>
          <button class="tab" data-tab="categorias" role="tab">
            Categorias
          </button>
        </nav>

        <!-- TAB PONTOS -->
        <div class="tab-painel" data-painel="pontos">
          <div class="painel-acoes">
            <h2>Pontos de coleta</h2>
            <button class="btn btn--primary" id="btn-novo-ponto">
              + Novo ponto
            </button>
          </div>
          <div id="lista-admin-pontos" class="lista-admin"></div>
        </div>

        <!-- TAB CATEGORIAS -->
        <div class="tab-painel" data-painel="categorias" hidden>
          <div class="painel-acoes">
            <h2>Categorias de materiais</h2>
            <button class="btn btn--primary" id="btn-nova-categoria">
              + Nova categoria
            </button>
          </div>
          <div id="lista-admin-categorias" class="lista-admin"></div>
        </div>
      </div>
    </section>

    <!-- MODAL -->
    <div class="modal" id="modal" hidden>
      <div class="modal__backdrop" data-fechar-modal></div>
      <div
        class="modal__conteudo"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-titulo"
      >
        <header class="modal__header">
          <h3 id="modal-titulo">Editar</h3>
          <button class="modal__fechar" data-fechar-modal aria-label="Fechar">
            ×
          </button>
        </header>
        <div class="modal__corpo" id="modal-corpo"></div>
        <footer class="modal__footer" id="modal-footer"></footer>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/pagina-admin.js"></script>
  </body>
</html>
