<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de pontos — ReciclaTech</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/mapa.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="logo">
          <span class="logo__icon" aria-hidden="true">♻️</span>
          <span class="logo__text" data-nome-plataforma>ReciclaTech</span>
        </a>
        <button
          class="menu-toggle"
          data-menu-toggle
          aria-label="Abrir menu"
          aria-expanded="false"
        >
          ☰
        </button>
        <nav class="site-nav" data-nav aria-label="Navegação principal">
          <a href="index.html">Início</a>
          <a href="mapa.html">Mapa</a>
          <a href="educacao.html">Educação</a>
          <a href="sobre.html">Sobre</a>
          <a href="admin.html" class="nav-admin">Admin</a>
        </nav>
      </div>
    </header>

    <main class="pagina-mapa">
      <section class="mapa-topo">
        <div class="container">
          <h1>Mapa de pontos de coleta</h1>
          <p>Filtre por material e cidade, e encontre o ponto mais próximo.</p>

          <form class="filtros" id="form-filtros" onsubmit="return false;">
            <div class="filtros__campo">
              <label for="filtro-categoria">Material</label>
              <select id="filtro-categoria"></select>
            </div>
            <div class="filtros__campo">
              <label for="filtro-cidade">Cidade</label>
              <select id="filtro-cidade"></select>
            </div>
            <div class="filtros__campo filtros__campo--busca">
              <label for="filtro-busca">Buscar</label>
              <input
                type="search"
                id="filtro-busca"
                placeholder="Nome, bairro..."
              />
            </div>
          </form>
        </div>
      </section>

      <section class="mapa-corpo">
        <div class="mapa-wrap">
          <div
            id="mapa-principal"
            role="application"
            aria-label="Mapa de pontos de coleta"
          ></div>
        </div>
        <aside class="mapa-sidebar" aria-live="polite">
          <p class="contador" id="contador-pontos">Carregando...</p>
          <div id="lista-pontos" class="lista-pontos"></div>
        </aside>
      </section>
    </main>

    <footer class="site-footer site-footer--simple">
      <div class="container footer-base__inner">
        <p>
          © <span data-ano></span> <span data-nome-plataforma>ReciclaTech</span>
        </p>
        <p><a href="index.html">Voltar ao início</a></p>
      </div>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/pagina-mapa.js"></script>
  </body>
</html>
